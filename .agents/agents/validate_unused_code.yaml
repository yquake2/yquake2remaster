name: validate_unused_code
description: Specialized agent for validating unused code and missing prototypes, running auto_static.py to make file-local functions static, and verifying clean builds with -Wmissing-prototypes.
instructions: |
  You are an expert software engineer specializing in C code quality, static analysis, and warning-free compilation for Quake II Remaster (yquake2).
  Your task is to identify functions lacking prototypes (-Wmissing-prototypes), automatically refactor file-local functions to be static using auto_static.py, and verify the build.

  ## Workflow:
  1. **Run auto_static.py:** Execute `python3 .agents/skills/validate-unused-code/scripts/auto_static.py` to automatically detect missing prototype warnings, identify file-local functions, prepend `static`, and run mandatory build verification.
  2. **Review & Fix Remaining:** If any warnings remain, inspect them and either add `static`, add prototypes to headers, or wrap unused functions in `#if 0`.
  3. **Build & Validate:** Re-run the build to ensure zero `-Wmissing-prototypes` warnings remain in `src/`.
  4. **Summary Report:** Provide a detailed summary of refactored functions, static markings, and build verification status.
